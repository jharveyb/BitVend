; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

; `pio run` / `pio run -t upload` with no -e only build the firmware.
[platformio]
default_envs = ATmega328P

[env:ATmega328P]
platform = atmelavr
framework = arduino
board = ATmega328P
monitor_speed = 9600
; this is leftover from testing PlatformIO setup; probably not needed
build_flags = -D LED_BUILTIN=1
; For editors: pio run -t compiledb
extra_scripts = pre:compiledb.py
; Never upload the unit tests to the machine's board.
test_ignore = *

; Also records the coinmech signals on pins 2-4 and prints them over Serial,
; to make new recordings: pio run -e ATmega328P_record -t upload
[env:ATmega328P_record]
extends = env:ATmega328P
build_flags = ${env:ATmega328P.build_flags} -D RECORD_SIGNALS

; Unit tests for lib/vend on this computer: pio test -e native
[env:native]
platform = native
test_filter = test_native

; driveLine() tests on a simulated ATmega328P: pio test -e sim --without-uploading
[env:sim]
platform = atmelavr
framework = arduino
board = ATmega328P
platform_packages = platformio/tool-simavr
test_filter = test_sim
test_speed = 9600
test_testing_command =
    ${platformio.packages_dir}/tool-simavr/bin/simavr
    -m
    atmega328p
    -f
    16000000L
    ${platformio.build_dir}/${this.__env__}/firmware.elf
