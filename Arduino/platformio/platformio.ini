; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

; `pio run` / `pio run -t upload` with no -e only build the default firmware.
[platformio]
default_envs = ATmega328P

[env:ATmega328P]
platform = atmelavr
framework = arduino
board = ATmega328P
monitor_speed = 9600
; this is leftover from testing PlatformIO setup; probably not needed
build_flags = -D LED_BUILTIN=1

; Also records the coinmech signals on pins 2-4 and prints them over Serial,
; to make new recordings: pio run -e ATmega328P_record -t upload
[env:ATmega328P_record]
extends = env:ATmega328P
build_flags = ${env:ATmega328P.build_flags} -D RECORD_SIGNALS
